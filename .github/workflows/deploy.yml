name: Deploy to GitHub Pages

on:
  push:
    # O repositório local nasceu em `master`. Aceitar os dois nomes evita um
    # deploy que silenciosamente nunca dispara.
    branches: [main, master]
  workflow_dispatch:

# Permissões exigidas pelo deploy-pages: o token precisa publicar no Pages e
# assinar o artefato via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, sem cancelar o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, não 20: undici e jsdom exigem `markAsUncloneable`, que só existe
          # a partir do Node 22. Em 20 o `npm ci` instala sem reclamar e o
          # vitest morre na partida, antes de rodar um teste sequer.
          node-version: 22
          cache: npm
      - run: npm ci
      # Os testes são a trava do deploy: os datasets gerados são versionados, e
      # é a suíte que confere que nenhum deles saiu torto.
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
